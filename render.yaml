services:
  - type: web
    name: urbaneye-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && gunicorn app:app --workers 1 --threads 2 --timeout 120"
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Firebase Cloud Messaging - paste the FULL service-account JSON string
      # (Firebase console -> Project settings -> Service accounts
      #  -> Generate new private key) as the value of this secret.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
